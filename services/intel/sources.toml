# Who wrote what, and how much one independent origin counts.
#
# domain   matched against the article's host and its parent domains, most specific first
# tier     one of the keys in [tiers]
# group    the owner. Outlets in one group are one origin: a WSJ story and a MarketWatch story are both Dow Jones.
#          Defaults to the domain.
# credits  regexes that mark a copy of this source's work, searched near the top and bottom of other outlets' text.
#          Only wires and press-release services need them.
#
# Hosts that start with investor. / investors. / ir. and aren't listed here count as primary (a company's own IR site).

[tiers]
primary = 1.0         # the official record or the party itself: SEC filings, agency releases, company IR
wire = 0.9            # reports first-hand and syndicates to everyone else
major = 0.75          # national outlets with their own reporting desks
trade = 0.6           # specialist press with beat reporters
press_release = 0.5   # a company's own paid statement: primary for what it says, nothing more
secondary = 0.35      # mostly rewrites of other outlets
community = 0.1       # leads, never corroboration on their own
aggregator = 0.0      # reposts other outlets' work; counts only once resolved to who wrote it
unknown = 0.2

