# --- wires ---
[[source]]
domain = "reuters.com"
name = "Reuters"
tier = "wire"
group = "reuters"
credits = ['\(Reuters\)\s*[-–—]', 'Reporting by [^\n]{0,200}; [Ee]diting by', '^\s*By Reuters\b', '^\s*Reuters\s*$']

[[source]]
domain = "apnews.com"
name = "Associated Press"
tier = "wire"
group = "ap"
credits = ['\(AP\)\s*[-–—]', '^\s*(By\s+)?(The\s+)?Associated Press\s*$', 'Copyright \d{4} The Associated Press',
           'Associated Press (writer|reporter)s? [^\n]{0,160} contributed']

[[source]]
domain = "bloomberg.com"
name = "Bloomberg"
tier = "wire"
group = "bloomberg"
credits = ['\(Bloomberg\)\s*(--|[-–—])', '^\s*Bloomberg News\s*$', '©\s*\d{4} Bloomberg']

[[source]]
domain = "afp.com"
name = "AFP"
tier = "wire"
group = "afp"
credits = ['\(AFP\)\s*[-–—]', 'Agence France-Presse']

[[source]]
domain = "dowjones.com"
name = "Dow Jones Newswires"
tier = "wire"
group = "dowjones"
credits = ['Dow Jones Newswires']

# --- press-release distribution ---
[[source]]
domain = "businesswire.com"
name = "Business Wire"
tier = "press_release"
credits = ['-+\s*\(BUSINESS WIRE\)\s*-+']

[[source]]
domain = "prnewswire.com"
name = "PR Newswire"
tier = "press_release"
credits = ['/PRNewswire(-\w+)?/\s*-+']

[[source]]
domain = "globenewswire.com"
name = "GlobeNewswire"
tier = "press_release"
credits = ['\(GLOBE NEWSWIRE\)\s*-+']

[[source]]
domain = "accesswire.com"
name = "ACCESSWIRE"
tier = "press_release"
credits = ['/\s*ACCESSWIRE\s*/']

[[source]]
domain = "newswire.ca"
name = "Canada Newswire"
tier = "press_release"
credits = ['/CNW/\s*-+']

