# Atropos public demo on Fly.io. Deploy with `fly deploy` after `fly launch --no-deploy --copy-config`.
# Change `app` if the name is taken.
app = "atropos-demo"
primary_region = "iad"

[env]
  ATROPOS_PUBLIC = "1"
  PORT = "8080"
  AGENT_EVERY_MIN = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
