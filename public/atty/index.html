<title>Atropos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
  /* Atty is a little yellow blob who lives on a black page. She sleeps until you come near,
     watches your cursor, squishes when poked and stretches when you drag her. The page is a
     conversation with her: short lines in her voice, each with one clear card, and tap
     replies to move on. */
  :root {
    color-scheme: dark;
    --bg: #000;
    --ink: #f5f5f2;
    --mute: #8e8e8a;
    --dim: #4a4a47;
    --card: #111110;
    --edge: #262624;
    --rule: #1c1c1a;
    --atty: #f8ca41;
    --up: #46e39f;
    --down: #ff5470;
    --f: "Geist", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --m: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: clip; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 19px/1.45 var(--f); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--atty); outline-offset: 3px; }
  p { margin: 0; }
  .mute { color: var(--mute); } .up { color: var(--up); } .down { color: var(--down); } .yel { color: var(--atty); }
  .n { font-variant-numeric: tabular-nums; }
  .lab { font: 500 12px/1.2 var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }

  #atty { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
  body.over-atty, body.over-atty * { cursor: grab !important; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  .top { position: fixed; inset: 0 0 auto 0; z-index: 15; display: flex; justify-content: space-between; align-items: center; padding: 22px clamp(18px, 3vw, 40px); background: linear-gradient(#000 40%, rgba(0, 0, 0, 0)); }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .top .right { display: flex; gap: 10px; align-items: center; }
  .chip { border: 1px solid var(--edge); background: #0b0b0a; color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; text-decoration: none; }
  .chip[aria-pressed="false"] { color: var(--mute); }

  /* the landing: Atty asleep, the claim, one button */
  .wake { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; padding: 0 20px 12vh; }
  .wake h1 { font-weight: 600; font-size: clamp(34px, 4.6vw, 64px); line-height: 1.02; letter-spacing: -.035em; margin: 0 auto 14px; max-width: 16ch; }
  .wake p { color: var(--mute); font-size: clamp(18px, 1.5vw, 21px); max-width: 34ch; margin: 0 auto 28px; }
  .go { background: var(--atty); color: #111; border: 0; border-radius: 999px; padding: 16px 28px; font-weight: 600; font-size: 18px; cursor: pointer; }
  .go:hover { filter: brightness(1.06); }

  /* the conversation */
  .chat { max-width: 680px; margin: 0 auto; padding: 0 20px 260px 120px; display: flex; flex-direction: column; gap: 14px; }
  .chat:not(:empty) { padding-top: 110px; }
  .msg { max-width: 100%; animation: pop .35s cubic-bezier(.2, .9, .3, 1.2) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  .msg.atty .bub { background: var(--card); border: 1px solid var(--edge); border-radius: 22px 22px 22px 6px; padding: 16px 20px; font-size: 21px; line-height: 1.35; }
  .msg.atty .bub .sub { color: var(--mute); display: block; margin-top: 6px; font-size: 18px; }
  .msg.you { align-self: flex-end; }
  .msg.you .bub { background: var(--atty); color: #111; border-radius: 22px 22px 6px 22px; padding: 12px 18px; font-weight: 500; }
  .typing .bub { width: 76px; display: flex; gap: 6px; justify-content: center; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); animation: dot 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 100% { opacity: .3; transform: none; } 50% { opacity: 1; transform: translateY(-3px); } }
  .w { opacity: .3; transition: opacity .12s; } .w.on { opacity: 1; }

  /* cards inside her messages */
  .card { margin-top: 10px; background: var(--card); border: 1px solid var(--edge); border-radius: 18px; overflow: hidden; }
  .card .pad { padding: 18px 20px; }
  .big { display: block; font-weight: 700; font-size: clamp(44px, 6vw, 72px); line-height: .95; letter-spacing: -.04em; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--edge); }
  .kpi { padding: 14px 18px; border-right: 1px solid var(--edge); }
  .kpi:last-child { border-right: 0; }
  .kpi b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin-top: 6px; }
  .rows .r { display: flex; justify-content: space-between; gap: 16px; padding: 12px 20px; border-top: 1px solid var(--rule); }
  .rows .r > span { color: var(--mute); }
  .rows .r b { font-weight: 500; text-align: right; }
  .rows .r em { font-style: normal; color: var(--mute); font-weight: 400; margin-left: 8px; }
  .tag { display: inline-block; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 15px; border: 1px solid var(--edge); }
  .tag.buy { color: var(--up); border-color: rgba(70, 227, 159, .5); }
  .tag.call { color: var(--atty); border-color: rgba(248, 202, 65, .5); }
  .tag.skip { color: var(--down); border-color: rgba(255, 84, 112, .5); }
  .tag.watch { color: var(--mute); }
  .reports { display: grid; grid-template-columns: repeat(3, 1fr); }
  .rep { border-right: 1px solid var(--edge); }
  .rep:last-child { border-right: 0; }
  .ph { aspect-ratio: 4 / 3; background: #1a1a18 center / cover no-repeat; }
  .rep .t { padding: 12px 14px 14px; }
  .rep b { display: block; font-size: 17px; }
  .rep small { display: block; color: var(--mute); font-size: 14px; margin-top: 2px; }
  .proof svg { width: 100%; height: auto; display: block; }
  .proof .paid { fill: #f5f5f2; }
  .proof .miss { fill: rgba(255, 84, 112, .18); stroke: #ff5470; stroke-width: 2; }
  .proof .calm { fill: #2a2a27; }
  .proof .base { stroke: #3a3a36; stroke-width: 1; }
  .proof .yr { fill: #8e8e8a; font: 500 16px "Geist Mono", monospace; }
  .key { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .key i { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; border-radius: 2px; }
  .key .kp { background: #f5f5f2; } .key .km { border: 2px solid #ff5470; }
  .barline { height: 8px; border-radius: 8px; background: #1e1e1c; overflow: hidden; }
  .barline i { display: block; height: 100%; border-radius: 8px; background: #6b6b66; }
  .barline i.you { background: var(--atty); }
  .story { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 12px 14px; border-top: 1px solid var(--rule); text-decoration: none; align-items: center; }
  .story:first-child { border-top: 0; }
  .story .pic { aspect-ratio: 4 / 3; border-radius: 10px; background: #1a1a18; overflow: hidden; }
  .story .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .story b { font-weight: 500; font-size: 17px; line-height: 1.3; display: block; margin-bottom: 4px; }
  .story:hover b { text-decoration: underline; text-underline-offset: 3px; }
  .inline { display: flex; gap: 8px; margin-top: 10px; }
  .inline input { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--edge); border-radius: 999px; color: var(--ink); font: inherit; font-size: 18px; padding: 13px 18px; outline: none; }
  .inline input:focus { border-color: var(--atty); }
  .inline button { background: var(--atty); color: #111; border: 0; border-radius: 999px; padding: 0 20px; font-weight: 600; cursor: pointer; }

  /* your replies, pinned to the bottom */
  .replies { position: fixed; left: 0; right: 0; bottom: 0; z-index: 14; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 18px 18px 26px; background: linear-gradient(rgba(0, 0, 0, 0), #000 35%); }
  .replies:empty { display: none; }
  .replies button { background: transparent; color: var(--atty); border: 1.5px solid var(--atty); border-radius: 999px; padding: 13px 20px; font-weight: 600; font-size: 17px; cursor: pointer; }
  .replies button.main { background: var(--atty); color: #111; }
  .replies button:hover { filter: brightness(1.1); }
  .foot { text-align: center; color: var(--dim); font-size: 13px; padding: 0 20px 140px; }

  @media (max-width: 720px) {
    body { font-size: 17px; }
    .chat { padding: 0 14px 240px 14px; }
    .chat:not(:empty) { padding-top: 150px; }
    .msg.atty .bub { font-size: 18px; }
    .reports { grid-template-columns: 1fr; }
    .rep { border-right: 0; border-bottom: 1px solid var(--edge); }
    .rep { display: grid; grid-template-columns: 110px 1fr; align-items: center; }
    .rep:last-child { border-bottom: 0; }
    .rep .ph { height: 100%; aspect-ratio: auto; min-height: 82px; }
    .kpi b { font-size: 22px; }
    .story { grid-template-columns: 90px 1fr; }
    .replies button { padding: 11px 16px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } .typing i { animation: none; } }
</style>

<canvas id="atty" aria-hidden="true"></canvas>

<header class="top">
  <span class="brand">Atropos</span>
  <span class="right"><button class="chip" id="sound" type="button" aria-pressed="true">Sound on</button><a class="chip" href="https://github.com/ebeirne/atropos" target="_blank" rel="noopener noreferrer">Code</a></span>
</header>

<section class="wake" id="wake">
  <h1>Most hedges miss the days you actually lose.</h1>
  <p id="claim">Atty checks yours against the days you really lost money.</p>
  <button class="go" id="wakeBtn" type="button">Wake Atty</button>
</section>

<main class="chat" id="chat" aria-live="polite"></main>
<p class="foot" id="foot">Not investment advice. Atty never trades. Numbers from code, every sentence checked by Jev.</p>

<nav class="replies" id="replies" aria-label="Your replies"></nav>

<script src="beats.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function h(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var money = function (x) { var s = '$' + Math.abs(Math.round(x)).toLocaleString('en-US'); return x < 0 ? '−' + s : s; };
  var money2 = function (x) { return '$' + Number(x).toFixed(2); };
  var cents = function (x) { var c = x * 100; return (Math.abs(c - Math.round(c)) > 1e-6 ? c.toFixed(1) : Math.round(c)) + '¢'; };
  var NAME = { cpi: 'Inflation report', nfp: 'Jobs report', fomc: 'Fed decision' };
  var PHOTO = { cpi: '../photos/cpi.jpg', nfp: '../photos/nfp.jpg', fomc: '../photos/fed.jpg' };
  var CALL = { good: ['buy', 'Buy it'], fair: ['call', 'Your call'], overpriced: ['skip', 'Skip'], too_small: ['skip', 'Too small'], none: ['watch', 'Watching'] };
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function when(iso) { var d = new Date(iso + 'T12:00:00'); return DAYS[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate(); }
  function ago(iso) { var m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function getJSON(live, fallback) {
    return fetch(live).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { if (j && j.result === null) throw 0; return { data: j, live: true }; })
      .catch(function () { return fetch(fallback).then(function (r) { return r.json(); }).then(function (j) { return { data: j, live: false }; }); });
  }

  /* ----------------------------------------------------------------- data */
  var DATA = {};
  function loadAll() {
    return Promise.all([
      getJSON('/api/agent', 'agent.json').then(function (r) { DATA.agent = r.data; DATA.live = r.live; }),
      getJSON('/api/thread', 'thread.json').then(function (r) { DATA.thread = r.data; }).catch(function () { DATA.thread = {}; }),
      getJSON('/api/events', '../tape.json').then(function (r) { DATA.tape = r.data; }).catch(function () { DATA.tape = { signals: [] }; }),
    ]).then(loadFunds);
  }
  function loadFunds() {
    var hs = DATA.agent.result.holdings; DATA.total = hs.reduce(function (s, x) { return s + x.value; }, 0);
    return getJSON('/api/funds?tickers=' + encodeURIComponent(hs.map(function (x) { return x.symbol; }).join(',')), 'funds.json')
      .then(function (r) { DATA.funds = r.data; }).catch(function () { DATA.funds = null; })
      .then(function () { DATA.beats = AttyBeats.beats(DATA); });
  }
  var ready = loadAll().then(function () { claimLine(); }).catch(function () { $('claim').textContent = 'Atty could not load her last check.'; });
  function mainP() { return DATA.agent.result.portfolio.filter(function (x) { return x.knot && x.best; })[0]; }
  function claimLine() {
    var p = mainP(), th = DATA.thread || {}, f = p && th.history && th.history.fits && th.history.fits[p.release + ':' + p.side];
    if (f && f.lossDays) $('claim').textContent = 'Inflation protection paid on ' + f.paidOnLoss + ' of your ' + f.lossDays + ' worst days. Atty can show you why.';
  }

  /* ---------------------------------------------------------------- cards */
  function threshold(p) { return p.unit === '%' ? (p.side === 'high' ? Math.ceil(p.threshold * 10 - 1e-9) : Math.floor(p.threshold * 10 + 1e-9)) / 10 + '%' : Math.round(p.threshold) + 'K'; }
  function sig(id) { return ((DATA.tape && DATA.tape.signals) || []).filter(function (s) { return s.id === id; })[0]; }
  function oddsOf(p) { var o = null; DATA.agent.result.holdings.forEach(function (x) { x.exposures.forEach(function (e) { if (o == null && e.release === p.release && e.side === p.side) o = e.odds; }); }); return o; }
  function reportsCard() {
    var cells = ['cpi', 'fomc', 'nfp'].map(sig).filter(Boolean).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).map(function (s) {
      var i = s.p.indexOf(Math.max.apply(null, s.p)), fav = s.id === 'cpi' ? s.labels[i].replace('-', '–') + '%' : s.id === 'nfp' ? s.labels[i].replace('-', 'K–') + 'K jobs' : s.labels[i];
      return '<div class="rep"><div class="ph" style="background-image:url(' + PHOTO[s.id] + ')"></div><div class="t"><b>' + NAME[s.id] + '</b><small>' + when(s.date) + '</small><small>Likely ' + esc(fav) + ' · ' + Math.round(s.p[i] * 100) + '%</small></div></div>';
    }).join('');
    return '<div class="card"><div class="reports">' + cells + '</div></div>';
  }
  function tradeCard(p) {
    var c = CALL[p.knot.verdict] || CALL.none, odds = oddsOf(p), yes = /^YES/.test(p.best.contract);
    var head = p.release === 'cpi' && p.side === 'high' ? 'If inflation hits ' + threshold(p) + '+' : p.release === 'nfp' && p.side === 'low' ? 'If job growth is ' + Math.round(p.threshold) + 'K or less' : 'If the ' + NAME[p.release].toLowerCase() + ' comes in ' + p.word;
    return '<div class="card"><div class="pad"><span class="lab">' + NAME[p.release] + ' · ' + when(p.best.expiry) + '</span><p style="font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:6px">' + esc(head) + '</p></div>' +
      '<div class="kpis"><div class="kpi"><span class="lab">You lose</span><b class="down n">' + money(-p.loss) + '</b></div><div class="kpi"><span class="lab">Odds</span><b class="n">' + (odds != null ? Math.round(odds * 100) + '%' : '–') + '</b></div><div class="kpi"><span class="lab">Atty says</span><span class="tag ' + c[0] + '" style="margin-top:8px">' + c[1] + '</span></div></div>' +
      '<div class="rows"><div class="r"><span>Buy</span><b>' + (yes ? 'YES' : 'NO') + ' · ' + esc(p.best.contract.replace(/^(YES|NO) on /, '').replace(/"/g, '')) + '</b></div>' +
      '<div class="r"><span>On</span><b>' + esc(p.best.venue) + '</b></div>' +
      '<div class="r"><span>Contracts</span><b class="n">' + p.knot.contracts.toLocaleString('en-US') + '</b></div>' +
      '<div class="r"><span>Price</span><b class="n">' + cents(p.best.ask + 0.01) + '<em>fair ' + cents(p.best.fair) + '</em></b></div>' +
      '<div class="r"><span>Cost</span><b class="n" style="font-size:22px">' + money2(p.knot.cost) + '</b></div>' +
      '<div class="r"><span>Pays if it happens</span><b class="n up">' + money(p.knot.payout) + '</b></div></div></div>';
  }
  function proofSVG(p) {
    var th = DATA.thread || {}, days = (th.history && th.history.days && th.history.days[p.release]) || [];
    if (!days.length) return '';
    var n = days.length, W = 1000, H = 230, base = H * 0.4, bw = W / n, last = '';
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Report days since 2021"><line class="base" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>';
    days.forEach(function (d, i) {
      var x = i * bw + bw * 0.16, w = bw * 0.68, m = Math.abs(d.ret), lost = d.ret <= -0.5;
      var hgt = Math.max(3, Math.min(d.ret < 0 ? H - base - 28 : base - 4, m * 32));
      var happened = p.side === 'high' ? d.value > d.before : d.value < d.before, cls = lost ? (happened ? 'paid' : 'miss') : 'calm';
      out += '<rect class="' + cls + '" x="' + x.toFixed(1) + '" y="' + (d.ret < 0 ? base : base - hgt).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hgt.toFixed(1) + '" rx="2"><title>' + d.date + ': ' + (d.ret < 0 ? '−' : '+') + m.toFixed(2) + '%</title></rect>';
      var yr = d.date.slice(0, 4); if (yr !== last) { if (last) out += '<text class="yr" x="' + x.toFixed(1) + '" y="' + (H - 4) + '">' + yr + '</text>'; last = yr; }
    });
    return out + '</svg>';
  }
  function proofCard(p, nb) {
    return '<div class="card"><div class="pad"><span class="big n">' + nb.paidOnLoss + '<span class="mute"> / ' + nb.lossDays + '</span></span><p class="mute" style="margin-top:8px">bad days it would have paid</p></div>' +
      '<div class="pad proof" style="padding-top:0">' + proofSVG(p) + '<div class="key lab"><span><i class="kp"></i>Paid</span><span><i class="km"></i>Missed</span><span>One bar per report</span></div></div></div>';
  }
  function fineCard(sh) {
    return '<div class="card"><div class="pad"><span class="big ' + (sh.pays ? 'up' : 'down') + '" style="font-size:clamp(38px,5vw,58px)">' + (sh.pays ? 'Still pays' : 'Won’t pay') + '</span><p class="mute" style="margin-top:8px">if the report is never published</p></div>' +
      '<div class="rows"><div class="r"><span>Settles on</span><b>' + esc(sh.fallback) + '</b></div><div class="r"><span>Last trade</span><b>' + esc(sh.stops) + '</b></div>' + (sh.latest ? '<div class="r"><span>Latest payout</span><b>' + esc(sh.latest) + '</b></div>' : '') + '</div></div>';
  }
  function skipCard(sh) {
    return '<div class="card"><div class="pad"><span class="big down">Skip</span></div>' + (sh.contract ? '<div class="rows"><div class="r"><span>Price with fee</span><b class="down">' + esc(sh.ask) + '</b></div><div class="r"><span>Worth</span><b>' + esc(sh.fair) + '</b></div></div>' : '') + '</div>';
  }
  function barsCard(rows) {
    var max = Math.max.apply(null, rows.map(function (b) { return Math.abs(b.v); })) || 1;
    return '<div class="card"><div class="rows">' + rows.map(function (b) {
      return '<div class="r" style="display:grid;grid-template-columns:1fr 1.2fr auto;align-items:center"><span' + (b.you ? ' class="yel"' : '') + '>' + esc(b.who) + '</span><span class="barline"><i class="' + (b.you ? 'you' : '') + '" style="width:' + (Math.abs(b.v) / max * 100).toFixed(1) + '%"></i></span><b class="n">' + (b.v < 0 ? '−' : '+') + Math.abs(b.v).toFixed(2) + '%</b></div>';
    }).join('') + '</div></div>';
  }
  function listCard(rows) { return '<div class="card"><div class="rows">' + rows.map(function (r) { return '<div class="r"><span>' + esc(r[0]) + '</span><b class="' + (r[2] || '') + '">' + esc(r[1]) + '</b></div>'; }).join('') + '</div></div>'; }
  function holdingsCard() {
    return listCard(DATA.agent.result.holdings.map(function (x) {
      var w = x.exposures[0], c = CALL[w && w.knot ? w.knot.verdict : 'none'] || CALL.none;
      return [x.symbol + ' · ' + money(x.value), w ? money(-w.loss) + ' · ' + c[1] : 'nothing pulls at it', w ? 'down' : ''];
    }));
  }
  function cardFor(b) {
    var sh = b.show || {}, nb = b.numbers || {}, p = mainP();
    if (b.id === 'hello') return reportsCard();
    if (b.id === 'risk') return listCard((sh.rows || []).map(function (x) { return [x.sym, '−' + x.loss, 'down']; }));
    if (b.id === 'trade') return p ? tradeCard(p) : '';
    if (b.id === 'fit') return p ? proofCard(p, nb) : '';
    if (b.id === 'fine') return fineCard(sh);
    if (b.id === 'skip') return skipCard(sh);
    if (b.id === 'peers') return barsCard(sh.rows || []);
    if (b.id === 'record') return listCard((sh.rows || []).map(function (x) { return [x.date + ' · ' + x.what, x.call + ' · ' + x.status]; }));
    return '';
  }

  /* ---------------------------------------------------------- her voice */
  var AC = null, analyser = null, abuf = null, decoded = {}, src = null, sound = true;
  function voiceUrl(text) { return DATA.live ? '/api/voice?t=' + encodeURIComponent(text) : 'voice/' + AttyBeats.hash(text) + '.mp3'; }
  function ensureAudio() {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return false; AC = new C(); analyser = AC.createAnalyser(); analyser.fftSize = 1024; abuf = new Float32Array(analyser.fftSize); analyser.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
    return true;
  }
  function decode(url) {
    if (decoded[url]) return decoded[url];
    decoded[url] = fetch(url).then(function (r) { if (!r.ok) throw new Error('no voice'); return r.arrayBuffer(); }).then(function (ab) { return new Promise(function (res, rej) { AC.decodeAudioData(ab, res, rej); }); });
    decoded[url].catch(function () { delete decoded[url]; });
    return decoded[url];
  }
  function stopVoice() { if (src) { try { src.stop(); } catch (_) {} src = null; } }
  /** Plays a recorded line; resolves with its length in ms, or null without sound. */
  function speak(text) {
    stopVoice();
    if (!sound || !ensureAudio()) return Promise.resolve(null);
    return decode(voiceUrl(text)).then(function (buf) { var s = AC.createBufferSource(); s.buffer = buf; s.connect(analyser); s.onended = function () { if (src === s) src = null; }; src = s; s.start(); return buf.duration * 1000; }).catch(function () { return null; });
  }
  $('sound').addEventListener('click', function () { sound = !sound; this.setAttribute('aria-pressed', String(sound)); this.textContent = sound ? 'Sound on' : 'Sound off'; if (!sound) stopVoice(); });

  /* ------------------------------------------------------- the conversation */
  var chat = $('chat'), lastAtty = null, step = 0, busy = false;
  var REPLY = { hello: 'What could hurt me?', risk: 'Can I protect it?', trade: 'Does that actually work?', fit: 'What if the report never comes out?', fine: 'Anything I should skip?', skip: 'How do I compare?', peers: 'Do you keep score?', record: 'Got it' };
  var MOOD = { hello: 'happy', risk: 'worried', trade: 'neutral', fit: 'skeptical', fine: 'curious', skip: 'stern', peers: 'neutral', record: 'happy', end: 'happy' };
  function scrollDown() { setTimeout(function () { window.scrollTo({ top: document.body.scrollHeight, behavior: reduce ? 'auto' : 'smooth' }); }, 40); }
  function you(text) { var m = h('<div class="msg you"><div class="bub">' + esc(text) + '</div></div>'); chat.appendChild(m); scrollDown(); }
  /** Atty says a line (typing first, then words lighting up with her voice) and shows a card. */
  function say(text, sub, card, mood, voiced) {
    return new Promise(function (done) {
      var t = h('<div class="msg atty typing"><div class="bub"><i></i><i></i><i></i></div></div>');
      chat.appendChild(t); lastAtty = t; scrollDown(); A.mood = 'thinking';
      setTimeout(function () {
        var m = h('<div class="msg atty"><div class="bub"></div></div>'), bub = m.firstChild;
        var words = text.split(' ').map(function (w, k) { var s = el('span', 'w', (k ? ' ' : '') + w); bub.appendChild(s); return s; });
        if (sub) bub.appendChild(el('span', 'sub', sub));
        chat.replaceChild(m, t); lastAtty = m; A.mood = mood || 'neutral'; A.hop(0.6);
        (voiced ? speak(text) : Promise.resolve(null)).then(function (ms) {
          var dur = reduce ? 0 : (ms || words.length * 170), t0 = performance.now();
          (function tick(now) {
            var n = dur ? Math.floor((now - t0) / dur * words.length) + 1 : words.length;
            words.forEach(function (w, k) { w.classList.toggle('on', k < n); });
            A.talking = n < words.length || !!src;
            if (n < words.length) return requestAnimationFrame(tick);
            if (card) { var c = h(card); m.appendChild(c); scrollDown(); }
            setTimeout(function () { A.talking = !!src; done(m); }, card ? 350 : 120);
          })(performance.now());
        });
      }, reduce ? 0 : 650);
    });
  }
  function replies(list) {
    var host = $('replies'); host.textContent = '';
    list.forEach(function (r, i) { var b = el('button', i === 0 ? 'main' : '', r.label); b.type = 'button'; b.addEventListener('click', function () { if (busy) return; host.textContent = ''; r.go(); }); host.appendChild(b); });
  }
  function next() {
    var b = DATA.beats[step]; if (!b || b.id === 'end') return endMenu();
    busy = true;
    if (b.id === 'skip') A.shake = 1;
    say(b.say, b.sub, cardFor(b), MOOD[b.id], true).then(function () {
      busy = false; step++;
      var nb = DATA.beats[step];
      if (!nb || nb.id === 'end') return endMenu();
      replies([{ label: REPLY[b.id] || 'Next', go: function () { you(REPLY[b.id] || 'Next'); next(); } }, { label: 'Skip to the end', go: function () { you('Skip to the end'); step = DATA.beats.length - 1; endMenu(); } }]);
    });
  }
  function menu() {
    replies([
      { label: 'Check my tickers', go: askTickers },
      { label: 'Show my holdings', go: function () { you('Show my holdings'); say('Here is everything you hold, and what could hurt each one.', null, holdingsCard(), 'neutral').then(menu); } },
      { label: 'What’s in the news?', go: askNews },
      { label: 'Start over', go: function () { you('Start over'); step = 0; next(); } },
    ]);
  }
  function endMenu() {
    var b = DATA.beats[DATA.beats.length - 1];
    busy = true;
    say(b.say, null, null, 'happy', true).then(function () { busy = false; menu(); });
  }
  function askForm(placeholder, button, onSubmit) {
    var f = h('<form class="inline" autocomplete="off"><input type="text" maxlength="200" placeholder="' + esc(placeholder) + '" aria-label="' + esc(placeholder) + '"><button type="submit">' + esc(button) + '</button></form>');
    f.addEventListener('submit', function (e) { e.preventDefault(); var q = f.querySelector('input').value.trim(); if (!q) return; f.remove(); onSubmit(q); });
    lastAtty.appendChild(f); setTimeout(function () { f.querySelector('input').focus({ preventScroll: true }); }, 50); scrollDown();
  }
  function askTickers() {
    you('Check my tickers');
    say('Type your tickers. Add dollar amounts if you like.', null, null, 'curious').then(function () {
      askForm('NVDA 20000, SPY, TLT', 'Check', function (q) {
        you(q.toUpperCase()); A.mood = 'thinking';
        fetch('/api/try?h=' + encodeURIComponent(q)).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'That did not work.'); return j; }); })
          .then(function (j) {
            DATA.agent = { result: j.agent.result, everyMinutes: null }; DATA.thread = j.thread; DATA.live = true;
            return loadFunds().then(function () { claimLine(); step = 0; say('Got it. Here is your week.', null, null, 'happy').then(next); });
          })
          .catch(function (err) {
            var m = String(err && err.message || err);
            say(/fetch|network|JSON|token/i.test(m) ? 'I can only check your own tickers in the live app. The sample is still here.' : m, null, null, 'worried').then(menu);
          });
      });
    });
  }
  function askNews() {
    you('What’s in the news?');
    say('Ask me about anything.', null, null, 'curious').then(function () {
      askForm('The Fed, layoffs, Nvidia…', 'Ask', function (q) {
        you(q); A.mood = 'thinking';
        fetch('/api/news?q=' + encodeURIComponent(q)).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (r) { return { r: r, saved: false }; })
          .catch(function () { return fetch('../news-sample.json').then(function (r) { return r.json(); }).then(function (r) { return { r: r, saved: true }; }); })
          .then(function (o) {
            var arts = o.r.articles.filter(function (a) { return /^[\x20-\x7e‘’“”–—…]+$/.test(a.title); }).slice(0, 12);
            arts = arts.filter(function (a) { return a.image; }).concat(arts.filter(function (a) { return !a.image; })).slice(0, 4);
            var card = '<div class="card">' + arts.map(function (a) {
              var img = a.image || (a.bearsOn ? PHOTO[a.bearsOn] : '');
              return '<a class="story" href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer"><span class="pic">' + (img ? '<img alt="" loading="lazy" referrerpolicy="no-referrer" src="' + esc(img) + '">' : '') + '</span><span><b>' + esc(a.title) + '</b><span class="lab">' + esc([a.source, a.published ? ago(a.published) : ''].filter(Boolean).join(' · ')) + '</span></span></a>';
            }).join('') + '</div>';
            return say(o.saved ? 'I can only search live in the app, so here is my last search: “' + o.r.query + '”.' : 'Here is what matters most on “' + q + '”.', null, card, 'neutral');
          })
          .then(menu);
      });
    });
  }
  var started = false;
  function start() {
    if (started) return; started = true; ensureAudio();
    A.wake(); A.hop(1.2);
    ready.then(function () { $('wake').style.display = 'none'; window.scrollTo(0, 0); next(); });
  }
  $('wakeBtn').addEventListener('click', start);

  /* ------------------------------------------------------------- Atty
     A soft blob drawn from a ring of points: a spring pulls her toward where she should be
     (the middle of the landing, then beside her newest message), she stretches along her
     speed, wobbles after a poke, keeps a little tail at the bottom, and her two eyes follow
     your cursor. She sleeps until you come near. Grab her to drag her; let go to throw. */
  var cv = $('atty'), ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  function size() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  size(); addEventListener('resize', size);
  var A = { x: innerWidth / 2, y: innerHeight * 0.36, vx: 0, vy: 0, r: 70, ang: 0, va: 0, wob: 0, wv: 0, mood: 'sleep', asleep: true, talking: false, shake: 0, drag: null, look: { x: 0, y: 0 }, lastActive: performance.now(), blinkAt: performance.now() + 2500, poked: 0 };
  A.hop = function (k) { A.vy -= 260 * k; A.wv += 5 * k; };
  A.wake = function () { if (A.asleep) { A.asleep = false; A.mood = 'surprised'; A.wv += 6; setTimeout(function () { if (A.mood === 'surprised') A.mood = 'happy'; }, 600); } A.lastActive = performance.now(); };
  var mouse = null;
  addEventListener('pointermove', function (e) {
    mouse = { x: e.clientX, y: e.clientY, t: performance.now() };
    var d = Math.hypot(e.clientX - A.x, e.clientY - A.y);
    document.body.classList.toggle('over-atty', d < A.r * 1.05 && !A.drag);
    if (d < A.r * 3) { A.lastActive = performance.now(); if (A.asleep) A.wake(); }
    if (A.drag) { var dtm = Math.max(1, performance.now() - A.drag.pt); A.drag.vx = (e.clientX - A.drag.px) / dtm * 1000; A.drag.vy = (e.clientY - A.drag.py) / dtm * 1000; A.drag.px = e.clientX; A.drag.py = e.clientY; A.drag.pt = performance.now(); }
  }, { passive: true });
  addEventListener('pointerdown', function (e) {
    if (Math.hypot(e.clientX - A.x, e.clientY - A.y) > A.r * 1.05) return;
    e.preventDefault();
    A.drag = { ox: A.x - e.clientX, oy: A.y - e.clientY, px: e.clientX, py: e.clientY, pt: performance.now(), vx: 0, vy: 0, at: performance.now() };
    document.body.classList.add('dragging'); A.wake(); A.mood = 'surprised';
  });
  addEventListener('pointerup', function () {
    if (!A.drag) return;
    var held = performance.now() - A.drag.at, dv = Math.hypot(A.drag.vx, A.drag.vy);
    if (held < 220 && dv < 300) { A.wv += 9; A.mood = 'surprised'; A.poked++; setTimeout(function () { A.mood = A.poked % 3 === 0 ? 'stern' : 'happy'; }, 450); }
    else { A.vx = A.drag.vx * 0.9; A.vy = A.drag.vy * 0.9; A.va = A.drag.vx * 0.0006; A.wv += 4; setTimeout(function () { A.mood = 'happy'; }, 700); }
    A.drag = null; document.body.classList.remove('dragging');
  });

  function home() {
    // the middle of the landing; once talking, just left of her newest message (above it on phones)
    if (!started || !lastAtty) return { x: innerWidth / 2, y: Math.min(innerHeight * 0.36, innerHeight - 380) };
    var b = lastAtty.getBoundingClientRect();
    if (innerWidth > 720) return { x: b.left - A.r - 18, y: Math.max(A.r + 70, Math.min(innerHeight - A.r - 120, b.top + A.r * 0.8)) };
    return { x: b.left + A.r * 0.9, y: Math.max(A.r + 64, Math.min(innerHeight - A.r - 120, b.top - A.r * 0.75)) };
  }
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    A.r = innerWidth > 720 ? (started ? 52 : 86) * (A.talking ? 1.04 : 1) : (started ? 40 : 66);
    if (!A.asleep && !started && now - A.lastActive > 12000) { A.asleep = true; }
    if (A.asleep) A.mood = 'sleep';
    var env = 0;
    if (src && analyser) { analyser.getFloatTimeDomainData(abuf); var s2 = 0; for (var k = 0; k < abuf.length; k++) s2 += abuf[k] * abuf[k]; env = Math.min(1, Math.sqrt(s2 / abuf.length) * 6); }
    else if (A.talking) env = 0.3 + 0.2 * Math.sin(now / 80);
    if (env > 0.25 && Math.random() < env * 0.08) A.wv += env * 1.2;
    if (A.drag && mouse) { var tx = mouse.x + A.drag.ox, ty = mouse.y + A.drag.oy; A.vx = (tx - A.x) / dt * 0.5; A.vy = (ty - A.y) / dt * 0.5; A.x += (tx - A.x) * 0.5; A.y += (ty - A.y) * 0.5; }
    else {
      var hm = home(), kx = 34, c = 7.5;
      hm.y += (A.asleep ? 4 : 7) * Math.sin(now / (A.asleep ? 900 : 620));
      A.vx += (kx * (hm.x - A.x) - c * A.vx) * dt; A.vy += (kx * (hm.y - A.y) - c * A.vy) * dt;
      A.x += A.vx * dt; A.y += A.vy * dt;
    }
    A.va *= Math.pow(0.08, dt); A.ang += A.va; A.ang *= Math.pow(0.15, dt);
    A.shake *= Math.pow(0.05, dt);
    A.wv += (-140 * A.wob - 7 * A.wv) * dt; A.wob += A.wv * dt;
    var lt = { x: 0, y: 0 };
    if (mouse && now - mouse.t < 3000 && !A.asleep) { var dx = mouse.x - A.x, dy = mouse.y - A.y, dl = Math.hypot(dx, dy) || 1; lt = { x: dx / dl * Math.min(1, dl / 200), y: dy / dl * Math.min(1, dl / 200) }; }
    A.look.x += (lt.x - A.look.x) * 0.15; A.look.y += (lt.y - A.look.y) * 0.15;
    if (now > A.blinkAt + 130) A.blinkAt = now + 2200 + Math.random() * 3200;
    var blink = now > A.blinkAt && now < A.blinkAt + 130;
    draw(env, blink, now);
    requestAnimationFrame(frame);
  }
  function draw(env, blink, now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    var R = A.r, sp = Math.hypot(A.vx, A.vy), st = reduce ? 0 : Math.min(0.42, sp / 2200), dir = Math.atan2(A.vy, A.vx);
    var breathe = A.asleep ? 0.03 * Math.sin(now / 700) : 0, talk = 0.05 * env * Math.sin(now / 55);
    ctx.save(); ctx.translate(A.x, A.y); ctx.rotate(A.ang + 0.1 * Math.sin(now / 45) * A.shake);
    // the body: a ring of points stretched along her speed, with a wobble and a little tail
    var N = 40, pts = [];
    for (var i = 0; i < N; i++) {
      var th = i / N * Math.PI * 2;
      var r = R * (1 + st * Math.cos(2 * (th - dir + A.ang)) - st * 0.35 + A.wob * 0.11 * Math.cos(2 * th) + breathe * Math.sin(th) + talk * Math.cos(2 * th));
      var dd = Math.atan2(Math.sin(th - 0.85), Math.cos(th - 0.85));
      r += R * 0.24 * Math.exp(-dd * dd / 0.05) * (1 - st);
      pts.push([Math.cos(th) * r, Math.sin(th) * r * (0.94 + 0.05 * env)]);
    }
    ctx.beginPath();
    for (var j = 0; j <= N; j++) { var a = pts[j % N], b = pts[(j + 1) % N], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; if (!j) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(a[0], a[1], mx, my); }
    ctx.closePath(); ctx.fillStyle = '#f8ca41'; ctx.fill();
    // the eyes
    var ex = R * 0.27, ey = -R * 0.05, lx = A.look.x * R * 0.13, ly = A.look.y * R * 0.1, ew = R * 0.13, eh = R * 0.15;
    ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.lineCap = 'round'; ctx.lineWidth = R * 0.06;
    var mood = A.mood;
    for (var s = -1; s <= 1; s += 2) {
      var cx = s * ex + lx, cy = ey + ly;
      ctx.beginPath();
      if (mood === 'sleep' || blink) { ctx.moveTo(cx - ew, cy + eh * 0.2); ctx.lineTo(cx + ew, cy + eh * 0.2); ctx.stroke(); continue; }
      if (mood === 'happy') { ctx.arc(cx, cy + eh * 0.45, ew * 0.95, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); continue; }
      if (mood === 'stern') { ctx.save(); ctx.translate(cx, cy); ctx.rotate(-s * 0.35); ctx.fillRect(-ew, -eh * 0.22, ew * 2, eh * 0.44); ctx.restore(); continue; }
      if (mood === 'worried') { ctx.ellipse(cx, cy, ew * 0.9, eh * 1.05, s * 0.3, 0, Math.PI * 2); ctx.fill(); continue; }
      if (mood === 'skeptical' && s > 0) { ctx.fillRect(cx - ew, cy - eh * 0.2, ew * 2, eh * 0.4); continue; }
      var k2 = mood === 'surprised' ? 1.3 : mood === 'curious' && s > 0 ? 1.2 : mood === 'thinking' ? 0.85 : 1;
      ctx.ellipse(cx, cy, ew * k2, eh * k2, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (mood === 'surprised') { ctx.beginPath(); ctx.ellipse(lx * 0.6, R * 0.32 + ly * 0.6, R * 0.06, R * 0.08, 0, 0, Math.PI * 2); ctx.fill(); }
    if (mood === 'thinking') { ctx.fillStyle = 'rgba(248,202,65,.85)'; for (var d2 = 0; d2 < 3; d2++) { var on = Math.floor(now / 250) % 3 === d2; ctx.beginPath(); ctx.arc(R * 0.85 + d2 * R * 0.22, -R * 0.95, R * (on ? 0.07 : 0.045), 0, Math.PI * 2); ctx.fill(); } }
    ctx.restore();
    if (A.asleep) { ctx.fillStyle = 'rgba(248,202,65,.6)'; ctx.font = '600 ' + Math.round(R * 0.32) + 'px Geist, sans-serif'; var zt = (now / 1400) % 1; ctx.globalAlpha = 1 - zt; ctx.fillText('z', A.x + R * 0.9 + zt * 14, A.y - R * 0.8 - zt * 26); ctx.globalAlpha = 1; }
  }
  requestAnimationFrame(frame);
})();
</script>
