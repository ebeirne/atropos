<title>Atropos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=swap">
<style>
  /* A stage, not a chat (Jev's call): one full-screen scene at a time, with Atty, a little
     yellow blob, in the middle of it physically handling the one thing that matters. She sits
     on your total, gets squashed by the loss, pushes the trade in, carries the fine print,
     and kicks the overpriced contract off the stage. You click Next. */
  :root {
    color-scheme: dark;
    --bg: #000;
    --ink: #f5f5f2;
    --mute: #8e8e8a;
    --dim: #4a4a47;
    --card: #111110;
    --edge: #262624;
    --rule: #1c1c1a;
    --atty: #f8ca41;
    --up: #46e39f;
    --down: #ff5470;
    --f: "Geist", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --m: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--bg); overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 19px/1.45 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--atty); outline-offset: 3px; }
  p { margin: 0; }
  .mute { color: var(--mute); } .up { color: var(--up); } .down { color: var(--down); } .yel { color: var(--atty); }
  .n { font-variant-numeric: tabular-nums; }
  .lab { font: 500 12px/1.2 var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }

  #atty { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
  body.over-atty, body.over-atty * { cursor: grab !important; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  .top { position: fixed; inset: 0 0 auto 0; z-index: 15; display: flex; justify-content: space-between; align-items: center; padding: 20px clamp(18px, 3vw, 40px); }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .top .right { display: flex; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--edge); background: #0b0b0a; color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; text-decoration: none; }
  .chip[aria-pressed="false"] { color: var(--mute); }

  /* scenes */
  .stage { position: fixed; inset: 0; }
  .scene { position: absolute; inset: 0; display: none; }
  .scene.on { display: block; animation: sceneIn .5s ease both; }
  @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
  .center { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); text-align: center; width: min(1100px, 92vw); }
  .huge { display: inline-block; font-weight: 800; font-size: clamp(64px, 13vw, 210px); line-height: .9; letter-spacing: -.05em; }
  .say { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); width: min(820px, 90vw); text-align: center; font-size: clamp(19px, 1.7vw, 24px); line-height: 1.35; }
  .say .sub { display: block; color: var(--mute); font-size: .85em; margin-top: 4px; }
  .w { opacity: .28; transition: opacity .12s; } .w.on { opacity: 1; }
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 20px; overflow: hidden; text-align: left; }
  .rows .r { display: flex; justify-content: space-between; gap: 16px; padding: 12px 20px; border-top: 1px solid var(--rule); }
  .rows .r:first-child { border-top: 0; }
  .rows .r > span { color: var(--mute); }
  .rows .r b { font-weight: 500; text-align: right; }
  .rows .r em { font-style: normal; color: var(--mute); font-weight: 400; margin-left: 8px; }
  .tag { display: inline-block; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 15px; border: 1px solid var(--edge); }
  .tag.buy { color: var(--up); border-color: rgba(70, 227, 159, .5); }
  .tag.call { color: var(--atty); border-color: rgba(248, 202, 65, .5); }
  .tag.skip { color: var(--down); border-color: rgba(255, 84, 112, .5); }
  .rise { animation: rise .6s cubic-bezier(.2, .9, .3, 1.15) both; }
  @keyframes rise { from { opacity: 0; translate: 0 30px; } to { opacity: 1; translate: 0 0; } }

  /* intro */
  .intro h1 { font-weight: 800; font-size: clamp(36px, 5vw, 72px); line-height: 1; letter-spacing: -.04em; margin: 0 auto 14px; max-width: 15ch; }
  .intro p { color: var(--mute); font-size: clamp(18px, 1.5vw, 21px); max-width: 36ch; margin: 0 auto 26px; }
  .intro .center { top: 66%; }
  .go { background: var(--atty); color: #111; border: 0; border-radius: 999px; padding: 16px 28px; font-weight: 700; font-size: 18px; cursor: pointer; }
  .go:hover { filter: brightness(1.06); }

  /* hello: the total and the three reports */
  .reports { position: absolute; left: 50%; top: 47%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 14px; }
  .rep { background: var(--card); border: 1px solid var(--edge); border-radius: 16px; overflow: hidden; }
  .rep .ph { aspect-ratio: 16 / 10; background: #1a1a18 center / cover no-repeat; }
  .rep .t { padding: 10px 12px 12px; }
  .rep b { display: block; font-size: 16px; } .rep small { display: block; color: var(--mute); font-size: 13px; }
  /* risk: the loss drops from above */
  .drop { animation: drop .75s cubic-bezier(.5, 0, .75, 0) both; }
  @keyframes drop { 0% { transform: translateY(-120vh); } 78% { transform: translateY(0); } 88% { transform: translateY(-14px); } 100% { transform: none; } }
  .hits { position: absolute; right: max(4vw, calc(50% - 560px)); top: 50%; transform: translateY(-50%); width: 260px; }
  /* trade: the ticket slides in, pushed */
  .ticket { position: absolute; left: 50%; top: 42%; width: min(520px, 90vw); transform: translate(-50%, -50%); }
  .ticket.push { animation: push 1.2s cubic-bezier(.3, .1, .2, 1) both; }
  @keyframes push { from { transform: translate(-150vw, -50%); } to { transform: translate(-50%, -50%); } }
  .ticket .hd { padding: 18px 20px; }
  .ticket .hd p { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
  .ticket .cost { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 20px; border-top: 1px solid var(--edge); }
  .ticket .cost b { font-size: 40px; font-weight: 800; letter-spacing: -.03em; }
  /* fit: the miss chart */
  .chart { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1000px, 92vw); }
  .chart .huge { font-size: clamp(64px, 10vw, 150px); }
  .proof svg { width: 100%; height: auto; display: block; margin-top: 10px; }
  .proof .paid { fill: #f5f5f2; }
  .proof .miss { fill: rgba(255, 84, 112, .18); stroke: #ff5470; stroke-width: 2; animation: blink 1.4s ease-in-out infinite alternate; }
  @keyframes blink { from { fill-opacity: .1; } to { fill-opacity: .55; } }
  .proof .calm { fill: #2a2a27; }
  .proof .base { stroke: #3a3a36; stroke-width: 1; }
  .proof .yr { fill: #8e8e8a; font: 500 16px "Geist Mono", monospace; }
  .key { display: flex; gap: 16px; justify-content: center; margin-top: 8px; }
  .key i { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; border-radius: 2px; }
  .key .kp { background: #f5f5f2; } .key .km { border: 2px solid #ff5470; }
  /* fine: the sign she carries */
  .sign { position: fixed; left: 0; top: 0; z-index: 19; background: var(--ink); color: #111; border-radius: 14px; padding: 14px 20px; text-align: center; display: none; transform-origin: 50% 100%; }
  .sign b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .sign b.up { color: #0f9a62; } .sign b.down { color: #d6213f; }
  .sign small { display: block; font-size: 14px; color: #555; }
  .fineinfo { position: absolute; right: max(4vw, calc(50% - 560px)); top: 50%; transform: translateY(-50%); width: 300px; }
  /* skip: the overpriced card gets kicked off */
  .kick { position: absolute; left: 50%; top: 44%; width: min(440px, 88vw); transform: translate(-50%, -50%); transition: transform .9s cubic-bezier(.3, -.2, .6, 1), opacity .9s; }
  .kick.gone { transform: translate(110vw, -90%) rotate(28deg); opacity: 0; }
  .skipword { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: transform .5s cubic-bezier(.2, 1.4, .4, 1), opacity .3s; color: var(--down); }
  .skipword.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  /* peers: she stands on your bar */
  .bars { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: min(820px, 90vw); display: grid; gap: 22px; }
  .bar { display: grid; grid-template-columns: 200px 1fr 90px; gap: 18px; align-items: center; }
  .bar span { color: var(--mute); }
  .bar .track { height: 26px; border-radius: 8px; background: #151513; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 8px; background: #57574f; width: 0; transition: width 1s cubic-bezier(.2, .8, .2, 1); }
  .bar.you span { color: var(--atty); } .bar.you .fill { background: var(--atty); }
  .bar b { font-weight: 700; font-size: 22px; text-align: right; }
  /* record and the end */
  .list { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); width: min(620px, 90vw); }
  .endbox { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: min(620px, 90vw); text-align: center; }
  .endbox h2 { font-weight: 800; font-size: clamp(40px, 5.5vw, 76px); letter-spacing: -.04em; margin: 0 0 22px; line-height: 1; }
  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--edge); border-radius: 999px; color: var(--ink); font: inherit; font-size: 18px; padding: 14px 20px; outline: none; }
  .inline input:focus { border-color: var(--atty); }
  .inline button { background: var(--atty); color: #111; border: 0; border-radius: 999px; padding: 0 22px; font-weight: 700; cursor: pointer; }
  .endbox .note { margin-top: 12px; min-height: 1.3em; }
  .news { margin-top: 18px; text-align: left; max-height: 40vh; overflow: auto; }
  .story { display: grid; grid-template-columns: 110px 1fr; gap: 14px; padding: 12px 14px; border-top: 1px solid var(--rule); text-decoration: none; align-items: center; }
  .story:first-child { border-top: 0; }
  .story .pic { aspect-ratio: 4 / 3; border-radius: 10px; background: #1a1a18; overflow: hidden; }
  .story .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .story b { font-weight: 500; font-size: 16px; line-height: 1.3; display: block; margin-bottom: 3px; }

  /* controls */
  .controls { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 16; display: flex; align-items: center; gap: 14px; }
  .controls[hidden] { display: none; }
  .back { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--edge); background: #0b0b0a; color: var(--ink); font-size: 22px; cursor: pointer; }
  .back:disabled { color: var(--dim); cursor: default; }
  .next { background: var(--atty); color: #111; border: 0; border-radius: 999px; padding: 15px 28px; font-weight: 700; font-size: 17px; cursor: pointer; min-width: 180px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #333; }
  .dots i.on { background: var(--atty); }
  .foot { position: fixed; left: 0; right: 0; bottom: 6px; z-index: 14; text-align: center; color: var(--dim); font-size: 11px; }

  @media (max-width: 760px) {
    body { font-size: 17px; }
    .center.hi { top: 22% !important; }
    .reports { grid-template-columns: 1fr; width: 86vw; top: 33%; gap: 8px; }
    .ticket { top: 47%; }
    .foot .more { display: none; }
    .rep { display: grid; grid-template-columns: 96px 1fr; }
    .rep .ph { aspect-ratio: auto; min-height: 64px; }
    .hits, .fineinfo { left: 50%; right: auto; top: auto; bottom: 200px; transform: translateX(-50%); width: 86vw; }
    .hits .rows .r:nth-child(n+3) { display: none; }
    .say { bottom: 96px; font-size: 17px; }
    .bar { grid-template-columns: 110px 1fr 70px; gap: 10px; }
    .bar b { font-size: 17px; }
    .next { min-width: 140px; padding: 14px 20px; }
    .dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .scene.on, .rise, .drop, .ticket.push, .proof .miss { animation: none; } .kick, .skipword, .bar .fill { transition: none; } }
</style>

<canvas id="atty" aria-hidden="true"></canvas>
<div class="sign" id="sign" aria-hidden="true"></div>

<header class="top">
  <span class="brand">Atropos</span>
  <span class="right"><button class="chip" id="sound" type="button" aria-pressed="true">Sound on</button><a class="chip" href="https://github.com/ebeirne/atropos" target="_blank" rel="noopener noreferrer">Code</a></span>
</header>

<main class="stage" id="stage" aria-live="polite">
  <section class="scene intro on" data-id="intro">
    <div class="center">
      <h1>Most hedges miss the days you actually lose.</h1>
      <p id="claim">Atty checks yours against the days you really lost money.</p>
      <button class="go" id="wakeBtn" type="button">Wake Atty</button>
    </div>
  </section>
</main>

<nav class="controls" id="controls" hidden>
  <button class="back" id="back" type="button" aria-label="Back">‹</button>
  <button class="next" id="next" type="button">Next</button>
  <span class="dots" id="dots"></span>
</nav>
<p class="foot">Not investment advice.<span class="more"> Atty never trades. Numbers from code, every sentence checked by Jev.</span></p>

<script src="beats.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function h(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var money = function (x) { var s = '$' + Math.abs(Math.round(x)).toLocaleString('en-US'); return x < 0 ? '−' + s : s; };
  var money2 = function (x) { return '$' + Number(x).toFixed(2); };
  var cents = function (x) { var c = x * 100; return (Math.abs(c - Math.round(c)) > 1e-6 ? c.toFixed(1) : Math.round(c)) + '¢'; };
  var NAME = { cpi: 'Inflation report', nfp: 'Jobs report', fomc: 'Fed decision' };
  var PHOTO = { cpi: '../photos/cpi.jpg', nfp: '../photos/nfp.jpg', fomc: '../photos/fed.jpg' };
  var CALL = { good: ['buy', 'Buy it'], fair: ['call', 'Your call'], overpriced: ['skip', 'Skip'], too_small: ['skip', 'Too small'], none: ['', 'Watching'] };
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function when(iso) { var d = new Date(iso + 'T12:00:00'); return DAYS[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate(); }
  function ago(iso) { var m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function getJSON(live, fallback) {
    return fetch(live).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { if (j && j.result === null) throw 0; return { data: j, live: true }; })
      .catch(function () { return fetch(fallback).then(function (r) { return r.json(); }).then(function (j) { return { data: j, live: false }; }); });
  }

  /* ----------------------------------------------------------------- data */
  var DATA = {};
  function loadAll() {
    return Promise.all([
      getJSON('/api/agent', 'agent.json').then(function (r) { DATA.agent = r.data; DATA.live = r.live; }),
      getJSON('/api/thread', 'thread.json').then(function (r) { DATA.thread = r.data; }).catch(function () { DATA.thread = {}; }),
      getJSON('/api/events', '../tape.json').then(function (r) { DATA.tape = r.data; }).catch(function () { DATA.tape = { signals: [] }; }),
    ]).then(loadFunds);
  }
  function loadFunds() {
    var hs = DATA.agent.result.holdings; DATA.total = hs.reduce(function (s, x) { return s + x.value; }, 0);
    return getJSON('/api/funds?tickers=' + encodeURIComponent(hs.map(function (x) { return x.symbol; }).join(',')), 'funds.json')
      .then(function (r) { DATA.funds = r.data; }).catch(function () { DATA.funds = null; })
      .then(function () { DATA.beats = AttyBeats.beats(DATA); });
  }
  function mainP() { return DATA.agent.result.portfolio.filter(function (x) { return x.knot && x.best; })[0]; }
  function sig(id) { return ((DATA.tape && DATA.tape.signals) || []).filter(function (s) { return s.id === id; })[0]; }
  function oddsOf(p) { var o = null; DATA.agent.result.holdings.forEach(function (x) { x.exposures.forEach(function (e) { if (o == null && e.release === p.release && e.side === p.side) o = e.odds; }); }); return o; }
  function threshold(p) { return p.unit === '%' ? (p.side === 'high' ? Math.ceil(p.threshold * 10 - 1e-9) : Math.floor(p.threshold * 10 + 1e-9)) / 10 + '%' : Math.round(p.threshold) + 'K'; }
  var ready = loadAll().then(function () {
    var p = mainP(), th = DATA.thread || {}, f = p && th.history && th.history.fits && th.history.fits[p.release + ':' + p.side];
    if (f && f.lossDays) $('claim').textContent = 'Inflation protection paid on ' + f.paidOnLoss + ' of your ' + f.lossDays + ' worst days. Atty will show you.';
  }).catch(function () { $('claim').textContent = 'Atty could not load her last check.'; });

  /* --------------------------------------------------------------- scenes
     Each scene: its markup, where Atty stands (an element and a way of standing by it), her
     mood, and a little choreography once it is on stage. */
  function proofSVG(p) {
    var th = DATA.thread || {}, days = (th.history && th.history.days && th.history.days[p.release]) || [];
    if (!days.length) return '';
    var n = days.length, W = 1000, H = 230, base = H * 0.4, bw = W / n, last = '';
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Report days since 2021"><line class="base" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>';
    days.forEach(function (d, i) {
      var x = i * bw + bw * 0.16, w = bw * 0.68, m = Math.abs(d.ret), lost = d.ret <= -0.5;
      var hgt = Math.max(3, Math.min(d.ret < 0 ? H - base - 28 : base - 4, m * 32));
      var happened = p.side === 'high' ? d.value > d.before : d.value < d.before, cls = lost ? (happened ? 'paid' : 'miss') : 'calm';
      out += '<rect class="' + cls + '" x="' + x.toFixed(1) + '" y="' + (d.ret < 0 ? base : base - hgt).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hgt.toFixed(1) + '" rx="2"><title>' + d.date + ': ' + (d.ret < 0 ? '−' : '+') + m.toFixed(2) + '%</title></rect>';
      var yr = d.date.slice(0, 4); if (yr !== last) { if (last) out += '<text class="yr" x="' + x.toFixed(1) + '" y="' + (H - 4) + '">' + yr + '</text>'; last = yr; }
    });
    return out + '</svg>';
  }
  function rowsHTML(rows) { return '<div class="rows">' + rows.map(function (r) { return '<div class="r"><span>' + esc(r[0]) + '</span><b class="' + (r[2] || '') + '">' + r[1] + '</b></div>'; }).join('') + '</div>'; }
  function sceneFor(b) {
    var sh = b.show || {}, nb = b.numbers || {}, p = mainP();
    var say = '<p class="say" data-say></p>';
    if (b.id === 'hello') {
      var cells = ['cpi', 'fomc', 'nfp'].map(sig).filter(Boolean).sort(function (a, c) { return a.date < c.date ? -1 : 1; }).map(function (s, k) {
        var i = s.p.indexOf(Math.max.apply(null, s.p)), fav = s.id === 'cpi' ? s.labels[i].replace('-', '–') + '%' : s.id === 'nfp' ? s.labels[i].replace('-', 'K–') + 'K jobs' : s.labels[i];
        return '<div class="rep rise" style="animation-delay:' + (0.4 + k * 0.15) + 's"><div class="ph" style="background-image:url(' + PHOTO[s.id] + ')"></div><div class="t"><b>' + NAME[s.id] + '</b><small>' + when(s.date) + ' · likely ' + esc(fav) + ' (' + Math.round(s.p[i] * 100) + '%)</small></div></div>';
      }).join('');
      return { html: '<div class="center hi" style="top:30%"><span class="huge n" data-anchor>' + money(DATA.total) + '</span></div><div class="reports">' + cells + '</div>' + say, stand: 'on', at: 0.78, mood: 'happy' };
    }
    if (b.id === 'risk') {
      return { html: '<div class="center" style="top:30%"><p class="mute rise" style="animation-delay:.9s;font-size:22px;margin-bottom:6px">if inflation runs hot · odds ' + Math.round((nb.odds || 0) * 100) + '%</p><span class="huge n down drop" data-anchor>' + money(-nb.loss) + '</span></div>' +
        '<div class="hits card rise" style="animation-delay:1.1s">' + rowsHTML((sh.rows || []).map(function (x) { return [x.sym, '−' + x.loss, 'down']; })) + '</div>' + say,
        stand: 'under', mood: 'worried', impact: reduce ? 0 : 640 };
    }
    if (b.id === 'trade' && p) {
      var c = CALL[p.knot.verdict] || CALL.none, odds = oddsOf(p), yes = /^YES/.test(p.best.contract);
